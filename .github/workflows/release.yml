name: Package Qwanto Beta

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional package validation note"
        required: false
        type: string
  push:
    tags:
      - "v*"
      - "package-validation-*"
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

concurrency:
  group: qwanto-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    environment: release-signing
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis,msi
            artifact: windows
          - os: macos-latest
            bundle: dmg
            artifact: macos
          - os: ubuntu-22.04
            bundle: appimage,deb
            artifact: linux

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential clang libomp-dev curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Python for the local gateway sidecar
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the target-native gateway sidecar
        shell: bash
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --clean --noconfirm c/qwanto_gateway.spec

      - name: Build shared web UI
        working-directory: web
        run: |
          npm ci
          npm run build
          npm test

      - name: Verify official Qwanto brand assets
        run: python c/tools/check_brand_assets.py

      - name: Build qwnrun on Linux or macOS
        if: runner.os != 'Windows'
        run: make -C c qwnrun

      - name: Build qwnrun on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Set-Location c
          clang -O3 -mavx2 -mf16c -mfma qwnrun.c qwanto_decode.c qwanto_native.c qwanto_kernels.c qwanto_turboquant.c qwanto_gpu.c qwanto_autopilot.c qwanto_thinking.c qwanto_speculative.c qwanto_agentic.c qwanto_bitdecoding.c qwanto_jetspec.c qwanto_talon.c qwanto_sliminfer.c qwanto_pquant.c qwanto_littlebit.c qwn_paged_kv.c -o qwnrun.exe -lpsapi

      - name: Stage target-native qwnrun resource
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/resources
          if [ "$RUNNER_OS" = "Windows" ]; then cp c/qwnrun.exe desktop/src-tauri/resources/qwnrun; else cp c/qwnrun desktop/src-tauri/resources/qwnrun; fi
          if [ "$RUNNER_OS" = "Windows" ]; then cp dist/qwanto-gateway.exe desktop/src-tauri/resources/qwanto-gateway; else cp dist/qwanto-gateway desktop/src-tauri/resources/qwanto-gateway; fi

      - name: Authenticate to Azure Artifact Signing
        if: runner.os == 'Windows' && vars.QWANTO_WINDOWS_SIGNING_ENABLED == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign native Windows sidecars
        if: runner.os == 'Windows' && vars.QWANTO_WINDOWS_SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.QWANTO_AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.QWANTO_AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.QWANTO_AZURE_CERTIFICATE_PROFILE }}
          files: |
            ${{ github.workspace }}\desktop\src-tauri\resources\qwnrun
            ${{ github.workspace }}\desktop\src-tauri\resources\qwanto-gateway
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Validate Rust desktop checks
        working-directory: desktop
        env:
          QWANTO_REQUIRE_SIDECAR_SMOKE: ${{ runner.os == 'Windows' && '1' || '0' }}
          QWANTO_GATEWAY_RESOURCE_DIR: ${{ github.workspace }}\desktop\src-tauri\resources
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Build desktop packages
        if: runner.os != 'macOS' || vars.QWANTO_MACOS_NOTARIZATION_ENABLED != 'true'
        working-directory: desktop
        run: cargo tauri build --bundles "${{ matrix.bundle }}"

      - name: Build macOS application for signing
        if: runner.os == 'macOS' && vars.QWANTO_MACOS_NOTARIZATION_ENABLED == 'true'
        working-directory: desktop
        run: cargo tauri build --bundles app

      - name: Sign, notarize, and verify macOS bundle
        if: runner.os == 'macOS' && vars.QWANTO_MACOS_NOTARIZATION_ENABLED == 'true'
        shell: bash
        env:
          MACOS_SIGNING_CERT_P12_B64: ${{ secrets.MACOS_SIGNING_CERT_P12_B64 }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/qwanto-signing.keychain-db"
          cert="$RUNNER_TEMP/qwanto-signing.p12"
          printf '%s' "$MACOS_SIGNING_CERT_P12_B64" | base64 --decode > "$cert"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security import "$cert" -P "$MACOS_SIGNING_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          app=$(find desktop/src-tauri/target/release/bundle -maxdepth 3 -name '*.app' -print -quit)
          test -n "$app"
          while IFS= read -r file; do
            if file "$file" | grep -q 'Mach-O'; then
              codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$file"
            fi
          done < <(find "$app/Contents" -type f)
          codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun notarytool submit "$app" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$app"
          dmg="desktop/src-tauri/target/release/bundle/dmg/Qwanto_${GITHUB_REF_NAME}_macOS.dmg"
          mkdir -p "$(dirname "$dmg")"
          hdiutil create -volname Qwanto -srcfolder "$app" -ov -format UDZO "$dmg"
          codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$dmg"
          codesign --verify --verbose=2 "$dmg"
          spctl --assess --type open --context context:primary-signature "$dmg"

      - name: Verify package contains the native resource and no model files
        shell: bash
        run: |
          test -f desktop/src-tauri/resources/qwnrun
          test -f desktop/src-tauri/resources/qwanto-gateway
          if find desktop/src-tauri/target/release/bundle -type f \( -iname '*.qwn' -o -iname '*.gguf' -o -iname '*.safetensors' \) | grep -q .; then exit 1; fi
          git diff --check

      - name: Sign Windows packages
        if: runner.os == 'Windows' && vars.QWANTO_WINDOWS_SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.QWANTO_AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.QWANTO_AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.QWANTO_AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\desktop\src-tauri\target\release\bundle
          files-folder-filter: exe,msi
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Windows Authenticode signatures
        if: runner.os == 'Windows' && vars.QWANTO_WINDOWS_SIGNING_ENABLED == 'true'
        shell: powershell
        run: |
          $targets = @(
            (Resolve-Path 'desktop/src-tauri/resources/qwnrun'),
            (Resolve-Path 'desktop/src-tauri/resources/qwanto-gateway')
          ) + @(Get-ChildItem 'desktop/src-tauri/target/release/bundle' -Recurse -File -Include *.exe,*.msi | ForEach-Object { $_.FullName })
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target
            if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature for $target: $($signature.Status)" }
          }

      - name: Create Linux detached signatures
        if: runner.os == 'Linux' && vars.QWANTO_LINUX_SIGNING_ENABLED == 'true'
        shell: bash
        env:
          GPG_PRIVATE_KEY_B64: ${{ secrets.GPG_PRIVATE_KEY_B64 }}
          GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
          GPG_KEY_PASSPHRASE: ${{ secrets.GPG_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          printf '%s' "$GPG_PRIVATE_KEY_B64" | base64 --decode | gpg --batch --import
          bundle="desktop/src-tauri/target/release/bundle"
          checksum="$bundle/Qwanto_${GITHUB_REF_NAME}_LINUX_SHA256SUMS.txt"
          find "$bundle" -type f \( -iname '*.appimage' -o -iname '*.deb' \) -print0 | sort -z | while IFS= read -r -d '' file; do sha256sum "$file"; done > "$checksum"
          sign() { gpg --batch --yes --armor --detach-sign --local-user "$GPG_KEY_ID" ${GPG_KEY_PASSPHRASE:+--pinentry-mode loopback --passphrase "$GPG_KEY_PASSPHRASE"} "$1"; }
          find "$bundle" -type f \( -iname '*.appimage' -o -iname '*.deb' \) -print0 | while IFS= read -r -d '' file; do sign "$file"; done
          sign "$checksum"
          gpg --batch --verify "$checksum.asc" "$checksum"

      - name: Upload ${{ matrix.artifact }} packages
        uses: actions/upload-artifact@v4
        with:
          name: qwanto-${{ matrix.artifact }}-${{ github.ref_name }}
          path: desktop/src-tauri/target/release/bundle
          if-no-files-found: error

  publish:
    name: Publish GitHub Beta release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    environment: release-signing
    permissions:
      contents: write
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qwanto-*
          path: release-assets
          merge-multiple: true

      - name: Create prerelease and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cp assets/brand/qwanto-icon.png release-assets/qwanto-icon.png
          mapfile -t assets < <(find release-assets -type f \( \
            -iname '*.exe' -o \
            -iname '*.msi' -o \
            -iname '*.dmg' -o \
            -iname '*.appimage' -o \
            -iname '*.deb' -o \
            -iname '*.asc' -o \
            -iname '*_LINUX_SHA256SUMS.txt' \
          \) -print)
          assets+=(release-assets/qwanto-icon.png)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No installer assets were downloaded" >&2
            exit 1
          fi
          checksum_file="Qwanto_${TAG}_SHA256SUMS.txt"
          : > "$checksum_file"
          for asset in "${assets[@]}"; do
            (cd "$(dirname "$asset")" && sha256sum "$(basename "$asset")") >> "$checksum_file"
          done
          notes_file="Qwanto_${TAG}_RELEASE_NOTES.md"
          cat > "$notes_file" <<EOF
          # Qwanto ${TAG}

          Beta release of the local-first Qwanto runtime and shared dashboard.

          - Windows signing: ${{ vars.QWANTO_WINDOWS_SIGNING_ENABLED == 'true' && 'enabled and Authenticode-verified' || 'disabled; packages are unsigned' }}.
          - macOS signing/notarization: ${{ vars.QWANTO_MACOS_NOTARIZATION_ENABLED == 'true' && 'enabled, stapled, and verified' || 'disabled; packages are unsigned and not notarized' }}.
          - Linux detached signatures: ${{ vars.QWANTO_LINUX_SIGNING_ENABLED == 'true' && 'enabled and GPG-verified' || 'disabled' }}.
          - This is a Beta prerelease and is not production-ready unless the applicable signing gates pass.
          - No model weights are bundled. Models remain user-managed and are imported or downloaded explicitly through the local gateway.
          - Verify installer integrity with the attached SHA-256 checksum file.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" "$checksum_file" --clobber
            gh release edit "$TAG" --title "Qwanto $TAG" --notes-file "$notes_file" --prerelease
          else
            gh release create "$TAG" "${assets[@]}" "$checksum_file" --prerelease --title "Qwanto $TAG" --notes-file "$notes_file"
          fi
