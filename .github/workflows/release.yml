name: Package Qwanto Native Beta

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional package validation note"
        required: false
        type: string
  push:
    tags:
      - "v*"
      - "package-validation-*"
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

concurrency:
  group: qwanto-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    environment: release-signing
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis,msi
            artifact: windows
          - os: macos-latest
            bundle: dmg
            artifact: macos
          - os: ubuntu-22.04
            bundle: appimage,deb
            artifact: linux

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential clang libomp-dev curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Python for the local gateway sidecar
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the target-native gateway sidecar
        shell: bash
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --clean --noconfirm c/qwanto_gateway.spec

      - name: Build shared web UI
        working-directory: web
        run: |
          npm ci
          npm run build
          npm test

      - name: Verify official Qwanto brand assets
        run: python c/tools/check_brand_assets.py

      - name: Verify built-in skill packages
        run: python c/tools/check_skill_packages.py

      - name: Verify release workflow policy
        run: python c/tools/check_release_workflow.py

      - name: Build qwnrun on Linux or macOS
        if: runner.os != 'Windows'
        run: make -C c qwnrun

      - name: Build qwnrun on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Set-Location c
          $ompLib = (& clang --print-file-name=libomp.lib).Trim()
          if (-not (Test-Path -LiteralPath $ompLib) -or $ompLib -match '\\arm64\\') {
            $ompRoots = @('C:\Program Files\Microsoft Visual Studio', 'C:\Program Files (x86)\Microsoft Visual Studio')
            if (-not [string]::IsNullOrWhiteSpace($env:VCToolsInstallDir) -and (Test-Path -LiteralPath $env:VCToolsInstallDir)) { $ompRoots += $env:VCToolsInstallDir }
            $ompLib = Get-ChildItem -Path $ompRoots -Filter libomp.lib -File -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\lib\\x64\\libomp\.lib$' } | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $ompLib -or -not (Test-Path -LiteralPath $ompLib)) { throw 'LLVM OpenMP import library was not found.' }
          $ompDllRoots = @('C:\Program Files\Microsoft Visual Studio', 'C:\Program Files (x86)\Microsoft Visual Studio')
          foreach ($root in @($env:VCToolsRedistDir, $env:VCToolsInstallDir)) { if (-not [string]::IsNullOrWhiteSpace($root) -and (Test-Path -LiteralPath $root)) { $ompDllRoots += $root } }
          $ompDll = Get-ChildItem -Path $ompDllRoots -Filter libomp140.x86_64.dll -File -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\(?:x64|amd64)\\' } | Select-Object -First 1
          clang -O3 -mavx2 -mf16c -mfma -fopenmp -D_CRT_SECURE_NO_WARNINGS -Wno-deprecated-declarations "-DQWN_BUILD_OPT_FLAGS=O3,mavx2,mf16c,mfma,openmp" qwnrun.c qwn_runtime_config.c qwanto_decode.c qwanto_native.c qwanto_kernels.c qwanto_turboquant.c qwanto_gpu.c qwanto_autopilot.c qwanto_thinking.c qwn_speculative.c qwanto_agentic.c qwanto_bitdecoding.c qwanto_jetspec.c qwanto_talon.c qwanto_sliminfer.c qwanto_pquant.c qwanto_littlebit.c qwn_paged_kv.c -o qwnrun.exe -lpsapi $ompLib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath $ompDll.FullName -Destination libomp140.x86_64.dll -Force

      - name: Build optional CUDA sidecar on Windows
        if: runner.os == 'Windows'
        shell: powershell
        env:
          QWANTO_CUDA_BUILD_ENABLED: ${{ vars.QWANTO_CUDA_BUILD_ENABLED }}
        run: |
          if ($env:QWANTO_CUDA_BUILD_ENABLED -eq 'false') {
            Write-Host 'CUDA sidecar build explicitly disabled; this package is CPU-only.'
            exit 0
          }
          $nvcc = Get-Command nvcc.exe -ErrorAction SilentlyContinue
          if (-not $nvcc) {
            Write-Host 'CUDA toolkit is not installed on this runner; this package is CPU-only and qwnrun will report CUDA unavailable.'
            exit 0
          }
          Set-Location c
          make qwn-cuda-dll
          if (-not (Test-Path qwn_cuda.dll)) { throw 'NVCC completed without producing c/qwn_cuda.dll.' }

      - name: Stage target-native qwnrun resource
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/resources
          if [ "$RUNNER_OS" = "Windows" ]; then cp c/qwnrun.exe desktop/src-tauri/resources/qwnrun; else cp c/qwnrun desktop/src-tauri/resources/qwnrun; fi
          if [ "$RUNNER_OS" = "Windows" ]; then cp c/libomp140.x86_64.dll desktop/src-tauri/resources/libomp140.x86_64.dll; fi
          if [ "$RUNNER_OS" = "Windows" ] && [ -f c/qwn_cuda.dll ]; then cp c/qwn_cuda.dll desktop/src-tauri/resources/qwn_cuda.dll; fi
          if [ "$RUNNER_OS" = "Windows" ]; then cp dist/qwanto-gateway.exe desktop/src-tauri/resources/qwanto-gateway; else cp dist/qwanto-gateway desktop/src-tauri/resources/qwanto-gateway; fi

      - name: Validate Windows signing configuration
        if: runner.os == 'Windows' && vars.SIGNING_ENABLED == 'true' && vars.QWANTO_WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ENDPOINT: ${{ vars.QWANTO_AZURE_SIGNING_ENDPOINT }}
          AZURE_ACCOUNT: ${{ vars.QWANTO_AZURE_SIGNING_ACCOUNT }}
          AZURE_PROFILE: ${{ vars.QWANTO_AZURE_CERTIFICATE_PROFILE }}
        run: |
          $required = @('AZURE_CLIENT_ID','AZURE_TENANT_ID','AZURE_SUBSCRIPTION_ID','AZURE_ENDPOINT','AZURE_ACCOUNT','AZURE_PROFILE')
          foreach ($name in $required) { if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) { throw "Windows signing is enabled but $name is missing." } }

      - name: Validate macOS signing configuration
        if: runner.os == 'macOS' && vars.SIGNING_ENABLED == 'true' && vars.QWANTO_MACOS_NOTARIZATION_ENABLED == 'true'
        shell: bash
        env:
          MAC_CERT: ${{ secrets.MACOS_SIGNING_CERT_P12_B64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          MAC_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          MAC_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MAC_CERT" && test -n "$MAC_CERT_PASSWORD" && test -n "$MAC_IDENTITY" && test -n "$MAC_KEYCHAIN_PASSWORD" && test -n "$APPLE_ID" && test -n "$APPLE_TEAM_ID" && test -n "$APPLE_PASSWORD"

      - name: Validate Linux signing configuration
        if: runner.os == 'Linux' && vars.SIGNING_ENABLED == 'true' && vars.QWANTO_LINUX_SIGNING_ENABLED == 'true'
        shell: bash
        env:
          GPG_PRIVATE_KEY_B64: ${{ secrets.GPG_PRIVATE_KEY_B64 }}
          GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$GPG_PRIVATE_KEY_B64" && test -n "$GPG_KEY_ID"

      - name: Authenticate to Azure Artifact Signing
        if: runner.os == 'Windows' && vars.SIGNING_ENABLED == 'true' && vars.QWANTO_WINDOWS_SIGNING_ENABLED == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign native Windows sidecars
        if: runner.os == 'Windows' && vars.SIGNING_ENABLED == 'true' && vars.QWANTO_WINDOWS_SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.QWANTO_AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.QWANTO_AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.QWANTO_AZURE_CERTIFICATE_PROFILE }}
          files: |
            ${{ github.workspace }}\desktop\src-tauri\resources\qwnrun
            ${{ github.workspace }}\desktop\src-tauri\resources\qwanto-gateway
            ${{ github.workspace }}\desktop\src-tauri\resources\libomp140.x86_64.dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign optional CUDA Windows sidecar
        if: runner.os == 'Windows' && vars.SIGNING_ENABLED == 'true' && vars.QWANTO_WINDOWS_SIGNING_ENABLED == 'true' && hashFiles('desktop/src-tauri/resources/qwn_cuda.dll') != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.QWANTO_AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.QWANTO_AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.QWANTO_AZURE_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\desktop\src-tauri\resources\qwn_cuda.dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Validate Rust desktop checks
        working-directory: desktop
        env:
          QWANTO_REQUIRE_SIDECAR_SMOKE: ${{ runner.os == 'Windows' && '1' || '0' }}
          QWANTO_GATEWAY_RESOURCE_DIR: ${{ github.workspace }}\desktop\src-tauri\resources
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Build desktop packages
        if: runner.os != 'macOS' || vars.SIGNING_ENABLED != 'true' || vars.QWANTO_MACOS_NOTARIZATION_ENABLED != 'true'
        working-directory: desktop
        run: cargo tauri build --bundles "${{ matrix.bundle }}"

      - name: Build macOS application for signing
        if: runner.os == 'macOS' && vars.SIGNING_ENABLED == 'true' && vars.QWANTO_MACOS_NOTARIZATION_ENABLED == 'true'
        working-directory: desktop
        run: cargo tauri build --bundles app

      - name: Sign, notarize, and verify macOS bundle
        if: runner.os == 'macOS' && vars.SIGNING_ENABLED == 'true' && vars.QWANTO_MACOS_NOTARIZATION_ENABLED == 'true'
        shell: bash
        env:
          MACOS_SIGNING_CERT_P12_B64: ${{ secrets.MACOS_SIGNING_CERT_P12_B64 }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/qwanto-signing.keychain-db"
          cert="$RUNNER_TEMP/qwanto-signing.p12"
          printf '%s' "$MACOS_SIGNING_CERT_P12_B64" | base64 --decode > "$cert"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security import "$cert" -P "$MACOS_SIGNING_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          app=$(find desktop/src-tauri/target/release/bundle -maxdepth 3 -name '*.app' -print -quit)
          test -n "$app"
          while IFS= read -r file; do
            if file "$file" | grep -q 'Mach-O'; then
              codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$file"
            fi
          done < <(find "$app/Contents" -type f)
          codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun notarytool submit "$app" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$app"
          dmg="$RUNNER_TEMP/Qwanto_Code_${GITHUB_REF_NAME}_macOS.dmg"
          mkdir -p "$(dirname "$dmg")"
          hdiutil create -volname "Qwanto Code" -srcfolder "$app" -ov -format UDZO "$dmg"
          codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$dmg"
          codesign --verify --verbose=2 "$dmg"
          spctl --assess --type open --context context:primary-signature "$dmg"
          mkdir -p desktop/src-tauri/target/release/bundle/dmg
          cp "$dmg" "desktop/src-tauri/target/release/bundle/dmg/Qwanto_Code_${GITHUB_REF_NAME}_macOS.dmg"

      - name: Verify package contains the native resource and no model files
        shell: bash
        run: |
          test -f desktop/src-tauri/resources/qwnrun
          test -f desktop/src-tauri/resources/qwanto-gateway
          if [ -f desktop/src-tauri/resources/qwn_cuda.dll ]; then test "$RUNNER_OS" = "Windows"; fi
          if find desktop/src-tauri/target/release/bundle -type f \( -iname '*.qwn' -o -iname '*.gguf' -o -iname '*.safetensors' \) | grep -q .; then exit 1; fi
          git diff --check

      - name: Sign Windows packages
        if: runner.os == 'Windows' && vars.SIGNING_ENABLED == 'true' && vars.QWANTO_WINDOWS_SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.QWANTO_AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.QWANTO_AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.QWANTO_AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\desktop\src-tauri\target\release\bundle
          files-folder-filter: exe,msi
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Windows Authenticode signatures
        if: runner.os == 'Windows' && vars.SIGNING_ENABLED == 'true' && vars.QWANTO_WINDOWS_SIGNING_ENABLED == 'true'
        shell: powershell
        run: |
          $targets = @(
            (Resolve-Path 'desktop/src-tauri/resources/qwnrun'),
            (Resolve-Path 'desktop/src-tauri/resources/qwanto-gateway')
          ) + @(Get-ChildItem 'desktop/src-tauri/target/release/bundle' -Recurse -File -Include *.exe,*.msi | ForEach-Object { $_.FullName })
          if (Test-Path 'desktop/src-tauri/resources/qwn_cuda.dll') { $targets += (Resolve-Path 'desktop/src-tauri/resources/qwn_cuda.dll') }
          if (Test-Path 'desktop/src-tauri/resources/libomp140.x86_64.dll') { $targets += (Resolve-Path 'desktop/src-tauri/resources/libomp140.x86_64.dll') }
          $signtool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if (-not $signtool) { throw 'SignTool is required to verify signed Windows release files.' }
          foreach ($target in $targets) {
            & $signtool.Source verify /pa /all /tw $target
            if ($LASTEXITCODE -ne 0) { throw "SignTool verification failed for $target" }
          }

      - name: Create Linux detached signatures
        if: runner.os == 'Linux' && vars.SIGNING_ENABLED == 'true' && vars.QWANTO_LINUX_SIGNING_ENABLED == 'true'
        shell: bash
        env:
          GPG_PRIVATE_KEY_B64: ${{ secrets.GPG_PRIVATE_KEY_B64 }}
          GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
          GPG_KEY_PASSPHRASE: ${{ secrets.GPG_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          printf '%s' "$GPG_PRIVATE_KEY_B64" | base64 --decode | gpg --batch --import
          bundle="desktop/src-tauri/target/release/bundle"
          checksum="$bundle/Qwanto_${GITHUB_REF_NAME}_LINUX_SHA256SUMS.txt"
          find "$bundle" -type f \( -iname '*.appimage' -o -iname '*.deb' \) -print0 | sort -z | while IFS= read -r -d '' file; do sha256sum "$file"; done > "$checksum"
          sign() { gpg --batch --yes --armor --detach-sign --local-user "$GPG_KEY_ID" ${GPG_KEY_PASSPHRASE:+--pinentry-mode loopback --passphrase "$GPG_KEY_PASSPHRASE"} "$1"; }
          find "$bundle" -type f \( -iname '*.appimage' -o -iname '*.deb' \) -print0 | while IFS= read -r -d '' file; do sign "$file"; done
          sign "$checksum"
          gpg --batch --verify "$checksum.asc" "$checksum"

      - name: Summarize signing status
        if: always()
        shell: bash
        env:
          WINDOWS_SIGNING_ENABLED: ${{ vars.QWANTO_WINDOWS_SIGNING_ENABLED }}
          MACOS_NOTARIZATION_ENABLED: ${{ vars.QWANTO_MACOS_NOTARIZATION_ENABLED }}
          LINUX_SIGNING_ENABLED: ${{ vars.QWANTO_LINUX_SIGNING_ENABLED }}
          SIGNING_ENABLED: ${{ vars.SIGNING_ENABLED }}
          PACKAGE_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          echo "### Signing status" >> "$GITHUB_STEP_SUMMARY"
          case "$RUNNER_OS" in
            Windows)
              if [ "$SIGNING_ENABLED" = "true" ] && [ "$WINDOWS_SIGNING_ENABLED" = "true" ]; then
                if [ "$PACKAGE_JOB_STATUS" = "success" ]; then echo "Windows signing: SIGNED and SignTool-verified" >> "$GITHUB_STEP_SUMMARY"; else echo "Windows signing: ENABLED / VERIFICATION FAILED" >> "$GITHUB_STEP_SUMMARY"; fi
              else
                echo "Windows signing: UNSIGNED" >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
            macOS)
              if [ "$SIGNING_ENABLED" = "true" ] && [ "$MACOS_NOTARIZATION_ENABLED" = "true" ]; then
                if [ "$PACKAGE_JOB_STATUS" = "success" ]; then echo "macOS notarization: SIGNED / NOTARIZED / STAPLED" >> "$GITHUB_STEP_SUMMARY"; else echo "macOS notarization: ENABLED / VERIFICATION FAILED" >> "$GITHUB_STEP_SUMMARY"; fi
              else
                echo "macOS notarization: UNSIGNED / NOT NOTARIZED" >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
            Linux)
              if [ "$SIGNING_ENABLED" = "true" ] && [ "$LINUX_SIGNING_ENABLED" = "true" ]; then
                if [ "$PACKAGE_JOB_STATUS" = "success" ]; then echo "Linux artifact signature: SIGNED and GPG-verified" >> "$GITHUB_STEP_SUMMARY"; else echo "Linux artifact signature: ENABLED / VERIFICATION FAILED" >> "$GITHUB_STEP_SUMMARY"; fi
              else
                echo "Linux artifact signature: UNSIGNED" >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
          esac

      - name: Upload ${{ matrix.artifact }} packages
        uses: actions/upload-artifact@v4
        with:
          name: qwanto-${{ matrix.artifact }}-${{ github.ref_name }}
          path: desktop/src-tauri/target/release/bundle
          if-no-files-found: error

  publish:
    name: Publish GitHub Beta release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    environment: release-signing
    permissions:
      contents: write
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qwanto-*
          path: release-assets
          merge-multiple: true

      - name: Create prerelease and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          WINDOWS_SIGNING_ENABLED: ${{ vars.QWANTO_WINDOWS_SIGNING_ENABLED }}
          MACOS_NOTARIZATION_ENABLED: ${{ vars.QWANTO_MACOS_NOTARIZATION_ENABLED }}
          LINUX_SIGNING_ENABLED: ${{ vars.QWANTO_LINUX_SIGNING_ENABLED }}
          SIGNING_ENABLED: ${{ vars.SIGNING_ENABLED }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -type f \( \
            -iname '*.exe' -o \
            -iname '*.msi' -o \
            -iname '*.dmg' -o \
            -iname '*.appimage' -o \
            -iname '*.deb' \
          \) -print)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No installer assets were downloaded" >&2
            exit 1
          fi
          installer_count=0
          for asset in "${assets[@]}"; do
            case "$asset" in
              *.exe|*.msi|*.dmg|*.AppImage|*.appimage|*.deb) installer_count=$((installer_count + 1)) ;;
            esac
          done
          if [ "$installer_count" -eq 0 ]; then
            echo "No Windows, macOS, or Linux installer assets were downloaded" >&2
            exit 1
          fi
          checksum_file="Qwanto_${TAG}_SHA256SUMS.txt"
          : > "$checksum_file"
          for asset in "${assets[@]}"; do
            (cd "$(dirname "$asset")" && sha256sum "$(basename "$asset")") >> "$checksum_file"
          done
          for asset in "${assets[@]}"; do
            basename="$(basename "$asset")"
            grep -Fq "$basename" "$checksum_file" || { echo "Missing checksum for $basename" >&2; exit 1; }
          done
          notes_file="Qwanto_${TAG}_RELEASE_NOTES.md"
          cat > "$notes_file" <<EOF
          # Qwanto Native ${TAG}

          Beta release of Qwanto Native, including the Qwanto Code desktop coding-agent surface.

          EOF
          if [ "$SIGNING_ENABLED" = "true" ] && [ "$WINDOWS_SIGNING_ENABLED" = "true" ]; then
            echo "- Windows signing: SIGNED and SignTool-verified." >> "$notes_file"
          else
            echo "- Windows signing: UNSIGNED." >> "$notes_file"
          fi
          if [ "$SIGNING_ENABLED" = "true" ] && [ "$MACOS_NOTARIZATION_ENABLED" = "true" ]; then
            echo "- macOS notarization: SIGNED / NOTARIZED / STAPLED." >> "$notes_file"
          else
            echo "- macOS notarization: UNSIGNED / NOT NOTARIZED." >> "$notes_file"
          fi
          if [ "$SIGNING_ENABLED" = "true" ] && [ "$LINUX_SIGNING_ENABLED" = "true" ]; then
            echo "- Linux artifact signature: SIGNED and GPG-verified." >> "$notes_file"
          else
            echo "- Linux artifact signature: UNSIGNED." >> "$notes_file"
          fi
          if [ "$SIGNING_ENABLED" != "true" ] || [ "$WINDOWS_SIGNING_ENABLED" != "true" ] || [ "$MACOS_NOTARIZATION_ENABLED" != "true" ] || [ "$LINUX_SIGNING_ENABLED" != "true" ]; then
            cat >> "$notes_file" <<'EOF'

          This is an unsigned beta release. Windows SmartScreen and macOS Gatekeeper may display warnings. Verify SHA-256 checksums before installing.
          This prerelease is not production-ready.
          EOF
          fi
          cat >> "$notes_file" <<'EOF'

          - No model weights are bundled. Models remain user-managed and are imported or downloaded explicitly through the local gateway.
          - Verify installer integrity with the attached SHA-256 checksum file.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" "$checksum_file" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Qwanto Native $TAG" --notes-file "$notes_file" --prerelease
          else
            gh release create "$TAG" "${assets[@]}" "$checksum_file" --repo "$GITHUB_REPOSITORY" --prerelease --title "Qwanto Native $TAG" --notes-file "$notes_file"
          fi
