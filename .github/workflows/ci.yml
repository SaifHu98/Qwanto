name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  schedule:
    - cron: "23 3 * * 1"

concurrency:
  group: qwanto-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  change-scope:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            native:
              - 'c/**/*.c'
              - 'c/**/*.h'
              - 'c/**/*.cu'
              - 'c/Makefile'
              - '.github/workflows/ci.yml'
            rust:
              - 'desktop/**'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
            python:
              - 'c/**/*.py'
              - 'c/tests/**/*.py'
              - 'benchmarks/**'
              - 'skills/**'
              - '.github/workflows/**'
            web:
              - 'web/**'
              - 'skills/**'
              - '.github/workflows/**'
            docs:
              - '*.md'
              - 'docs/**'
              - '.github/ISSUE_TEMPLATE/**'

  native-c-engine:
    name: Native C (${{ matrix.os }})
    needs: change-scope
    if: needs.change-scope.outputs.native == 'true' || needs.change-scope.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            artifact: qwnrun
          - os: windows-latest
            cc: clang
            artifact: qwnrun.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Build native runtime and C tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          make -C c CC="sccache ${{ matrix.cc }}" glm qwnrun
          make -C c CC="sccache ${{ matrix.cc }}" test-c
      - name: Build native runtime and C tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location c
          $ompLib = (& clang --print-file-name=libomp.lib).Trim()
          if (-not (Test-Path -LiteralPath $ompLib) -or $ompLib -match '\\arm64\\') {
            $ompRoots = @('C:\Program Files\Microsoft Visual Studio', 'C:\Program Files (x86)\Microsoft Visual Studio')
            if (-not [string]::IsNullOrWhiteSpace($env:VCToolsInstallDir) -and (Test-Path -LiteralPath $env:VCToolsInstallDir)) { $ompRoots += $env:VCToolsInstallDir }
            $ompLib = Get-ChildItem -Path $ompRoots -Filter libomp.lib -File -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\lib\\x64\\libomp\.lib$' } | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $ompLib -or -not (Test-Path -LiteralPath $ompLib)) { throw 'LLVM OpenMP import library was not found.' }
          $ompDllRoots = @('C:\Program Files\Microsoft Visual Studio', 'C:\Program Files (x86)\Microsoft Visual Studio')
          foreach ($root in @($env:VCToolsRedistDir, $env:VCToolsInstallDir)) { if (-not [string]::IsNullOrWhiteSpace($root) -and (Test-Path -LiteralPath $root)) { $ompDllRoots += $root } }
          $ompDll = Get-ChildItem -Path $ompDllRoots -Filter libomp140.x86_64.dll -File -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\(?:x64|amd64)\\' } | Select-Object -First 1
          if (-not $ompDll) { throw 'LLVM OpenMP runtime DLL libomp140.x86_64.dll was not found.' }
          sccache clang -O3 -mavx2 -mf16c -mfma -fopenmp '-DQWN_BUILD_OPT_FLAGS="O3,mavx2,mf16c,mfma,openmp"' qwnrun.c qwn_runtime_config.c qwanto_decode.c qwanto_native.c qwanto_kernels.c qwanto_turboquant.c qwanto_gpu.c qwanto_autopilot.c qwanto_thinking.c qwanto_speculative.c qwanto_agentic.c qwanto_bitdecoding.c qwanto_jetspec.c qwanto_talon.c qwanto_sliminfer.c qwanto_pquant.c qwanto_littlebit.c qwn_paged_kv.c -o qwnrun.exe -lpsapi $ompLib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath $ompDll.FullName -Destination libomp140.x86_64.dll -Force
          make test-c
      - name: Upload native runtime
        uses: actions/upload-artifact@v4
        with:
          name: qwnrun-${{ runner.os }}
          path: c/${{ matrix.artifact }}
          if-no-files-found: error
      - name: Upload Windows OpenMP runtime
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: qwnrun-runtime-${{ runner.os }}
          path: c/libomp140.x86_64.dll
          if-no-files-found: error

  rust-tauri-host:
    name: Rust/Tauri host
    needs: [change-scope, native-c-engine]
    if: (needs.change-scope.outputs.rust == 'true' || github.event_name == 'workflow_dispatch') && needs.native-c-engine.result == 'success'
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Cache Tauri CLI
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            tauri-cli-${{ runner.os }}-
      - name: Install Tauri CLI
        shell: bash
        run: |
          if ! command -v cargo-tauri >/dev/null 2>&1; then
            cargo install tauri-cli --version '^2' --locked
          fi
      - name: Download qwnrun artifact
        uses: actions/download-artifact@v4
        with:
          name: qwnrun-Linux
          path: desktop/src-tauri/resources
      - name: Stage gateway resource placeholder
        shell: bash
        run: |
          : > desktop/src-tauri/resources/qwanto-gateway
          chmod +x desktop/src-tauri/resources/qwanto-gateway
      - name: Validate Rust host
        run: |
          cargo check --manifest-path desktop/src-tauri/Cargo.toml
          cargo test --manifest-path desktop/src-tauri/Cargo.toml
          cargo clippy --manifest-path desktop/src-tauri/Cargo.toml -- -D warnings

  python:
    name: Python
    needs: change-scope
    if: needs.change-scope.outputs.python == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install native decoder dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libomp-dev
      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip -r requirements-ci.txt
      - name: Verify official Qwanto brand assets
        run: python c/tools/check_brand_assets.py
      - name: Verify built-in skill packages
        run: python c/tools/check_skill_packages.py
      - name: Verify release workflow policy
        run: python c/tools/check_release_workflow.py
      - name: Run Python tests
        run: python -m pytest c/tests/ -q

  docs:
    name: Documentation
    needs: change-scope
    if: needs.change-scope.outputs.docs == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation links
        run: python c/tools/check_doc_links.py
      - name: Check documentation for trailing whitespace
        shell: bash
        run: '! git grep -n ''[[:blank:]]$'' -- ''*.md'''
      - name: Audit documentation changes for secrets
        run: python c/tools/audit_secrets.py

  web:
    name: Web
    needs: change-scope
    if: needs.change-scope.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check License Integrity (Apache 2.0)
        run: |
          grep -q "Apache License" LICENSE
          grep -q "Version 2.0" LICENSE
      - name: Audit for hardcoded secrets
        run: python c/tools/audit_secrets.py
