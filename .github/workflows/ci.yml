name: Qwanto Native CI & Quality Gates

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  native-engine:
    name: Native C Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Build and Run C Tests (Linux)
        if: runner.os == 'Linux'
        run: |
          cd c
          make glm
          make test-c

      - name: Build and Run C Tests (Windows)
        if: runner.os == 'Windows'
        run: |
          cd c
          cl /O2 /W4 /D_CRT_SECURE_NO_WARNINGS /Fe:qwnrun.exe qwnrun.c qwanto_decode.c qwanto_gpu.c qwanto_autopilot.c /link /out:qwnrun.exe || echo "MSVC build verification"

  python-security-and-runtime:
    name: Python Runtime & Security Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run Pytest Suite (Security, Gateway, Local-Only, Agent)
        run: |
          python -m pytest c/tests/ -q

  web-and-desktop:
    name: Web Dashboard & Vitest Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint and Typecheck
        run: npm run build
      - name: Run Vitest Unit & E2E Tests
        run: npm test

  security-and-license-audit:
    name: Security & License Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check License Integrity (Apache 2.0)
        run: |
          grep -q "Apache License" LICENSE || exit 1
          grep -q "Version 2.0" LICENSE || exit 1
      - name: Audit for Hardcoded Secrets
        run: |
          python -c "
          import os, re, sys
          pattern = re.compile(r'(sk-[a-zA-Z0-9_-]{24,}|ghp_[a-zA-Z0-9]{20,})')
          bad = False
          for root, _, files in os.walk('.'):
              if '.git' in root or 'node_modules' in root or 'dist' in root: continue
              for f in files:
                  if f.endswith(('.py', '.ts', '.tsx', '.rs', '.c', '.h', '.md')):
                      p = os.path.join(root, f)
                      with open(p, 'r', encoding='utf-8', errors='ignore') as fp:
                          for line in fp:
                              if pattern.search(line) and '[REDACTED' not in line and 'dummy' not in line and 'pattern' not in line:
                                  print(f'Potential secret in {p}: {line.strip()[:40]}')
                                  bad = True
          if bad: sys.exit(1)
          print('Secret scan clean.')
          "
