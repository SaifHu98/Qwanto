name: Qwanto Native CI & Quality Gates

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  native-c-engine:
    name: Native C Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Build and Run C Tests (Linux)
        if: runner.os == 'Linux'
        run: |
          cd c
          make glm
          make qwnrun
          make test-c

      - name: Build and Verify Native Engine (Windows)
        if: runner.os == 'Windows'
        run: |
          cd c
          clang -O3 -mavx2 -mf16c -mfma qwnrun.c qwanto_decode.c qwanto_native.c qwanto_kernels.c qwanto_turboquant.c qwanto_gpu.c qwanto_autopilot.c qwanto_thinking.c qwanto_speculative.c qwanto_agentic.c qwanto_bitdecoding.c qwanto_jetspec.c qwanto_talon.c qwanto_sliminfer.c qwanto_pquant.c qwanto_littlebit.c qwn_paged_kv.c -o qwnrun.exe -lpsapi

  rust-tauri-host:
    name: Rust Tauri Host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux System Dependencies for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev pkg-config

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Build and stage qwnrun resource (Linux)
        if: runner.os == 'Linux'
        run: |
          make -C c qwnrun
          mkdir -p desktop/src-tauri/resources
          cp c/qwnrun desktop/src-tauri/resources/qwnrun

      - name: Build and stage qwnrun resource (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force desktop/src-tauri/resources | Out-Null
          Set-Location c
          clang -O3 -mavx2 -mf16c -mfma qwnrun.c qwanto_decode.c qwanto_native.c qwanto_kernels.c qwanto_turboquant.c qwanto_gpu.c qwanto_autopilot.c qwanto_thinking.c qwanto_speculative.c qwanto_agentic.c qwanto_bitdecoding.c qwanto_jetspec.c qwanto_talon.c qwanto_sliminfer.c qwanto_pquant.c qwanto_littlebit.c qwn_paged_kv.c -o qwnrun.exe -lpsapi
          Copy-Item qwnrun.exe ..\desktop\src-tauri\resources\qwnrun -Force

      - name: Cargo Check
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml

      - name: Cargo Unit Tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml

      - name: Cargo Clippy
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml -- -D warnings

  python-security-and-runtime:
    name: Python Runtime & Security Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install native decoder dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libomp-dev
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy
      - name: Run Pytest Suite (Security, Gateway, Local-Only, Agent, Protocol)
        run: |
          python -m pytest c/tests/ -q
      - name: Check repository documentation links
        run: python c/tools/check_doc_links.py

  web-dashboard:
    name: Web Dashboard & Vitest Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: TypeScript & Vite Build
        run: npm run build
      - name: Run Vitest Unit & E2E Tests
        run: npm test

  security-and-license-audit:
    name: Security & License Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check License Integrity (Apache 2.0)
        run: |
          grep -q "Apache License" LICENSE || exit 1
          grep -q "Version 2.0" LICENSE || exit 1
      - name: Audit for Hardcoded Secrets
        run: python c/tools/audit_secrets.py
