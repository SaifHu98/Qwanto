[package]
name = "qwanto-desktop"
version = "0.1.0"
description = "Native desktop shell for the Qwanto local AI inference runtime"
authors = ["SaifHu98 <saifhu98@github.com>"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "qwanto_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
